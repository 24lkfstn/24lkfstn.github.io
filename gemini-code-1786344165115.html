<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>緊急聯絡人資料庫 (24lkfstn)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#080d1a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js for export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .highlight { 
            background-color: rgba(245, 158, 11, 0.35); 
            color: #fef08a; 
            padding: 0 2px; 
            border-radius: 2px; 
        }
        /* Mobile Scrollbar Hide for filter chips */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth touch scrolling */
        .touch-scroll { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-slate-900 pb-20 sm:pb-8">

    <!-- PIN Gate Overlay -->
    <div id="pinGateOverlay" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4 text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white shadow-md shadow-cyan-900/30">
                <i class="fa-solid fa-lock text-xl"></i>
            </div>
            <div>
                <h2 class="text-base font-bold text-slate-100">請輸入 PIN 碼</h2>
                <p class="text-xs text-slate-400 mt-1">此資料庫僅供授權人員查閱</p>
            </div>
            <form id="pinForm" onsubmit="handlePinSubmit(event)" class="space-y-3">
                <input type="password" inputmode="numeric" autocomplete="off" id="pinInput" maxlength="20" placeholder="輸入 PIN 碼"
                    class="w-full text-center tracking-widest text-lg px-3 py-2.5 bg-slate-950 border border-slate-700 focus:border-cyan-500 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 transition">
                <p id="pinError" class="hidden text-xs text-rose-400">PIN 碼錯誤，請重試</p>
                <button type="submit" class="w-full py-2.5 bg-cyan-600 active:bg-cyan-500 text-white rounded-xl text-sm font-semibold shadow-md shadow-cyan-900/20 transition">
                    進入
                </button>
            </form>
        </div>
    </div>

    <!-- Sticky Mobile Header -->
    <header class="bg-slate-900/95 border-b border-slate-800/80 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-3xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white shadow-md shadow-cyan-900/30 shrink-0">
                    <i class="fa-solid fa-phone-volume text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-slate-100 leading-tight">緊急聯絡人資料庫</h1>
                    <div class="flex items-center gap-1.5">
                        <p class="text-[10px] sm:text-xs text-slate-400">地點應變通訊總表</p>
                        <span id="cloudStatus" class="text-[9px] px-1.5 py-0.2 bg-emerald-950/85 text-emerald-400 border border-emerald-800/50 rounded font-mono">Supabase 雲端資料庫</span>
                    </div>
                </div>
            </div>

            <!-- Header Quick Actions -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="exportToPDF()" class="p-2 sm:px-3 sm:py-2 bg-slate-800 active:bg-slate-700 text-emerald-400 border border-slate-700/80 rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-file-pdf text-sm"></i>
                    <span class="hidden sm:inline">導出 PDF</span>
                </button>

                <button onclick="openLocationModal()" class="hidden sm:flex px-3 py-2 bg-cyan-600 active:bg-cyan-500 text-white rounded-xl text-xs font-medium shadow-md shadow-cyan-900/20 transition items-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新增地點</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Toast Notification Box -->
    <div id="toastContainer" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-sm px-4 flex flex-col items-center gap-2"></div>

    <main class="flex-1 max-w-3xl w-full mx-auto px-3 sm:px-6 py-4 space-y-4">

        <!-- Search Bar & Statistics Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-lg space-y-3">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </div>
                <input type="text" id="searchInput" oninput="handleSearch()" 
                    placeholder="搜尋地點、聯絡人、電話、門牌..." 
                    class="w-full pl-10 pr-10 py-2.5 bg-slate-950 border border-slate-700/80 focus:border-cyan-500 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 transition text-base sm:text-sm">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 active:text-slate-200">
                    <i class="fa-solid fa-circle-xmark text-base"></i>
                </button>
            </div>

            <!-- Mobile Swipeable Filter Categories -->
            <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800/60">
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar touch-scroll py-0.5 max-w-full" id="categoryChips">
                    <!-- Dynamic Category Filter Chips -->
                </div>
                <div class="text-[11px] text-slate-400 shrink-0 font-mono" id="resultCountText">
                    0 個地點
                </div>
            </div>
        </div>

        <!-- Location Cards List -->
        <div id="locationGrid" class="space-y-3 sm:space-y-4">
            <!-- Dynamic Location Cards -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden py-12 text-center space-y-3 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-slate-500 text-xl">
                <i class="fa-solid fa-building-circle-xmark"></i>
            </div>
            <div class="space-y-1">
                <h3 class="text-slate-300 font-semibold text-sm">未有找到相關記錄</h3>
                <p class="text-slate-500 text-xs">請嘗試更換搜尋關鍵字，或新增資料</p>
            </div>
            <button onclick="clearSearch()" class="px-4 py-2 bg-slate-800 active:bg-slate-700 text-cyan-400 text-xs rounded-xl transition">
                清除搜尋條件
            </button>
        </div>

    </main>

    <!-- Mobile Floating Action Button (FAB) -->
    <button onclick="openLocationModal()" 
        aria-label="新增地點"
        class="sm:hidden fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-cyan-600 active:bg-cyan-500 text-white shadow-2xl shadow-cyan-900/60 flex items-center justify-center text-xl transition transform active:scale-95 border border-cyan-400/30">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal: Add / Edit Location (Mobile Bottom-Sheet Style) -->
    <div id="locationModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
                <div class="flex items-center gap-2">
                    <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-building-user text-cyan-400"></i>
                        <span>新增緊急聯絡地點</span>
                    </h3>
                </div>
                <button onclick="closeLocationModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 active:text-slate-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Mode Selector: Form vs Batch Text Paste -->
            <div class="flex border-b border-slate-800 bg-slate-950/60 px-4 pt-2 gap-2 text-xs">
                <button type="button" id="tabFormBtn" onclick="switchModalTab('form')" class="px-3 py-1.5 border-b-2 border-cyan-500 text-cyan-400 font-medium">單筆表單輸入</button>
                <button type="button" id="tabBatchBtn" onclick="switchModalTab('batch')" class="px-3 py-1.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200">文字批次匯入</button>
            </div>
            
            <!-- Standard Form -->
            <form id="locationForm" onsubmit="saveLocation(event)" class="flex-1 overflow-y-auto p-4 space-y-4 touch-scroll">
                <input type="hidden" id="formLocationId">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">建築物 / 地點名稱 <span class="text-rose-400">*</span></label>
                    <input type="text" id="formName" required placeholder="例如：荔景體育館" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 text-base sm:text-sm focus:border-cyan-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">分類類別</label>
                        <input type="text" id="formCategory" placeholder="例如：社區 / 教育 / 康體 / 醫療" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 text-base sm:text-sm focus:border-cyan-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">真實門牌地址</label>
                        <input type="text" id="formAddress" placeholder="例如：葵涌麗祖路77號" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 text-base sm:text-sm focus:border-cyan-500 focus:outline-none">
                    </div>
                </div>

                <!-- Contacts Section inside Form -->
                <div class="pt-2">
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-address-book text-slate-400"></i> 聯絡人名單
                        </label>
                        <button type="button" onclick="addContactRow()" class="text-xs text-cyan-400 active:text-cyan-300 flex items-center gap-1 font-medium py-1 px-2 bg-cyan-950/40 rounded-lg border border-cyan-800/40">
                            <i class="fa-solid fa-plus-circle"></i> 新增聯絡人
                        </button>
                    </div>
                    
                    <div id="contactRowsContainer" class="space-y-2.5">
                        <!-- Dynamic Contact Rows -->
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3 pb-2">
                    <button type="button" onclick="closeLocationModal()" class="px-4 py-2.5 bg-slate-800 active:bg-slate-700 text-slate-300 text-xs rounded-xl font-medium">取消</button>
                    <button type="submit" class="px-5 py-2.5 bg-cyan-600 active:bg-cyan-500 text-white text-xs font-semibold rounded-xl shadow-md">儲存資料</button>
                </div>
            </form>

            <!-- Quick Batch Text Area -->
            <div id="batchContainer" class="hidden flex-1 overflow-y-auto p-4 space-y-3 touch-scroll">
                <p class="text-xs text-slate-400 leading-relaxed">
                    請貼上多筆資料，每列一筆，格式如下：<br>
                    <code class="text-cyan-400 bg-slate-950 px-1.5 py-0.5 rounded">地點名稱, 分類, 地址, 聯絡人, 電話, 身份</code>
                </p>
                <textarea id="batchInput" rows="6" placeholder="例如：
荔景社區中心, 社區, 荔景山路200號, 李先生, 91234567, 主管
葵涌救護站, 緊急, 葵涌道1號, 值班房, 27110557, 熱線" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 text-xs font-mono focus:border-cyan-500 focus:outline-none leading-relaxed"></textarea>
                
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeLocationModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl">取消</button>
                    <button type="button" onclick="processBatchImport()" class="px-5 py-2 bg-emerald-600 active:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow-md">解析並匯入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-950/80 border border-rose-800/50 flex items-center justify-center text-rose-400 shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-base"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-slate-100">確認刪除地點</h3>
                    <p id="deleteTargetName" class="text-xs text-slate-400 mt-0.5 truncate max-w-[200px]"></p>
                </div>
            </div>

            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="deleteConfirmCheck" onchange="toggleDeleteButton()" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-rose-600 focus:ring-0">
                    <span class="text-xs text-slate-300 font-medium">我確定要永久刪除此筆記錄</span>
                </label>
            </div>

            <div class="flex items-center justify-end gap-2 pt-1">
                <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-medium">取消</button>
                <button type="button" id="confirmDeleteBtn" onclick="executeDelete()" disabled class="px-4 py-2 bg-rose-600/40 text-slate-400 text-xs font-semibold rounded-xl transition cursor-not-allowed">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- Hidden Container for PDF Export -->
    <div id="pdfPrintArea" class="hidden p-6 bg-white text-slate-900"></div>

    <!-- Supabase Database Core Script -->
    <script>
        // TODO: 將下面兩個變數換成你 Supabase 專案的實際 URL 同埋 Key
        const SUPABASE_URL = 'https://okbcntgzetdukczshddu.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        // 初始化 Supabase Client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const TABLE_NAME = 'locations'; // 請確保 Supabase 入面有開咗呢張 Table

        // Global State
        window.locations = [];
        window.activeCategory = 'ALL';
        window.pendingDeleteId = null;

        // PIN Gate
        const PIN_CODE = '27431925';
        const PIN_STORAGE_KEY = 'ecdb_pin_unlocked';

        function handlePinSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('pinInput');
            const val = input.value.trim();

            if (val === PIN_CODE) {
                localStorage.setItem(PIN_STORAGE_KEY, 'true');
                document.getElementById('pinError').classList.add('hidden');
                document.getElementById('pinGateOverlay').classList.add('hidden');
                loadLocations();
            } else {
                document.getElementById('pinError').classList.remove('hidden');
                input.value = '';
                input.focus();
            }
        }

        // Load data on startup from Supabase Database
        async function loadLocations() {
            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('*');
                
                if (error) throw error;
                window.locations = Array.isArray(data) ? data : [];
            } catch (e) {
                console.warn('Supabase Database error:', e);
                showToast('讀取雲端資料失敗，請檢查設定', 'error');
            }
            renderCategoryChips();
            renderCards();
        }

        // Initialize app on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem(PIN_STORAGE_KEY) === 'true') {
                document.getElementById('pinGateOverlay').classList.add('hidden');
                loadLocations();
            } else {
                document.getElementById('pinInput')?.focus();
            }
        });

        // UI Toast Notification helper
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-900/90 border-rose-700 text-rose-200' : 'bg-cyan-900/90 border-cyan-700 text-cyan-200';
            
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border ${bgClass} text-xs font-medium shadow-xl backdrop-blur-md transition transform duration-300 opacity-0 translate-y-2 flex items-center gap-2`;
            toast.innerHTML = `<i class="${type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function switchModalTab(tab) {
            const formEl = document.getElementById('locationForm');
            const batchEl = document.getElementById('batchContainer');
            const tabFormBtn = document.getElementById('tabFormBtn');
            const tabBatchBtn = document.getElementById('tabBatchBtn');

            if (tab === 'form') {
                formEl.classList.remove('hidden');
                batchEl.classList.add('hidden');
                tabFormBtn.className = 'px-3 py-1.5 border-b-2 border-cyan-500 text-cyan-400 font-medium';
                tabBatchBtn.className = 'px-3 py-1.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200';
            } else {
                formEl.classList.add('hidden');
                batchEl.classList.remove('hidden');
                tabBatchBtn.className = 'px-3 py-1.5 border-b-2 border-cyan-500 text-cyan-400 font-medium';
                tabFormBtn.className = 'px-3 py-1.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200';
            }
        }

        async function processBatchImport() {
            const text = document.getElementById('batchInput').value.trim();
            if (!text) {
                showToast('請輸入批次文字資料', 'error');
                return;
            }

            const lines = text.split('\n');
            const newLocations = [];

            for (const line of lines) {
                const parts = line.split(/[,，]/).map(p => p.trim());
                if (parts.length >= 1 && parts[0]) {
                    const name = parts[0];
                    const category = parts[1] || '其他';
                    const address = parts[2] || '';
                    const contactName = parts[3] || '聯絡人';
                    const phone = parts[4] || '';
                    const role = parts[5] || '聯絡人';

                    const locationObj = {
                        id: 'loc_' + Date.now() + Math.random().toString(36).substr(2, 4),
                        name,
                        category,
                        address,
                        contacts: phone ? [{ name: contactName, phone, role }] : []
                    };
                    newLocations.push(locationObj);
                }
            }

            if (newLocations.length === 0) {
                showToast('未解析到有效資料', 'error');
                return;
            }

            try {
                // Supabase 批次寫入 (upsert)
                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .upsert(newLocations);

                if (error) throw error;

                await loadLocations();
                showToast(`成功匯入 ${newLocations.length} 筆地點資料至 Supabase！`);
                document.getElementById('batchInput').value = '';
                closeLocationModal();
            } catch (err) {
                console.error(err);
                showToast('匯入 Supabase 失敗', 'error');
            }
        }

        function renderCategoryChips() {
            const categories = ['ALL', ...new Set((window.locations || []).map(l => l.category).filter(Boolean))];
            const chipsContainer = document.getElementById('categoryChips');
            
            chipsContainer.innerHTML = categories.map(cat => {
                const label = cat === 'ALL' ? '全部' : cat;
                const active = window.activeCategory === cat;
                return `
                    <button onclick="setCategory('${cat}')" 
                        class="px-3 py-1 rounded-lg text-xs font-medium whitespace-nowrap transition shrink-0 ${
                            active 
                            ? 'bg-cyan-600 text-white font-semibold shadow-sm' 
                            : 'bg-slate-800 text-slate-400 active:bg-slate-700 active:text-slate-200'
                        }">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        function setCategory(cat) {
            window.activeCategory = cat;
            renderCategoryChips();
            renderCards();
        }

        function handleSearch() {
            const val = document.getElementById('searchInput').value.trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', val === '');
            renderCards();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            window.activeCategory = 'ALL';
            renderCategoryChips();
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('locationGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            let filtered = (window.locations || []).filter(loc => {
                const matchCategory = window.activeCategory === 'ALL' || loc.category === window.activeCategory;
                
                if (!matchCategory) return false;
                if (!searchVal) return true;

                const nameMatch = loc.name.toLowerCase().includes(searchVal);
                const catMatch = (loc.category || '').toLowerCase().includes(searchVal);
                const addrMatch = (loc.address || '').toLowerCase().includes(searchVal);
                const contactMatch = (loc.contacts || []).some(c => 
                    c.name.toLowerCase().includes(searchVal) || 
                    c.phone.replace(/\s+/g, '').includes(searchVal.replace(/\s+/g, '')) ||
                    (c.role || '').toLowerCase().includes(searchVal)
                );

                return nameMatch || catMatch || addrMatch || contactMatch;
            });

            document.getElementById('resultCountText').textContent = `${filtered.length} 個地點`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(item => {
                const contactsHTML = (item.contacts || []).map(c => `
                    <div class="flex items-center justify-between p-2.5 bg-slate-950/80 border border-slate-800 rounded-xl active:border-slate-700 transition gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 shrink-0 text-xs">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="truncate">
                                <span class="text-sm font-semibold text-slate-200 truncate block">${highlightText(c.name, searchVal)}</span>
                                ${c.role ? `<span class="text-[10px] text-slate-400">${c.role}</span>` : ''}
                            </div>
                        </div>
                        <a href="tel:${c.phone.replace(/\s+/g, '')}" class="px-3 py-1.5 bg-emerald-950/80 active:bg-emerald-900 border border-emerald-800/60 text-emerald-300 rounded-lg text-xs font-bold font-mono transition flex items-center gap-1.5 shrink-0 shadow-sm">
                            <i class="fa-solid fa-phone text-[11px]"></i>
                            <span>${highlightText(c.phone, searchVal)}</span>
                        </a>
                    </div>
                `).join('');

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md flex flex-col justify-between space-y-3">
                        <div>
                            <!-- Header -->
                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                <div class="space-y-1 min-w-0">
                                    ${item.category ? `<span class="inline-block text-[10px] font-semibold tracking-wider text-cyan-400 uppercase bg-cyan-950/80 border border-cyan-800/50 px-2 py-0.5 rounded-md">${item.category}</span>` : ''}
                                    <h3 class="text-base font-bold text-slate-100 leading-snug break-words">
                                        ${highlightText(item.name, searchVal)}
                                    </h3>
                                </div>
                                <div class="flex items-center gap-0.5 shrink-0">
                                    <button onclick="editLocation('${item.id}')" title="編輯" class="p-2 text-slate-400 active:text-cyan-400 transition">
                                        <i class="fa-solid fa-pen-to-square text-base"></i>
                                    </button>
                                    <button onclick="promptDelete('${item.id}')" title="刪除" class="p-2 text-slate-400 active:text-rose-400 transition">
                                        <i class="fa-solid fa-trash-can text-base"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Real Address -->
                            ${item.address ? `
                                <p class="text-xs text-slate-400 mb-3 flex items-start gap-1.5 leading-relaxed">
                                    <i class="fa-solid fa-location-dot text-slate-500 mt-0.5 shrink-0"></i> 
                                    <span>${highlightText(item.address, searchVal)}</span>
                                </p>
                            ` : ''}

                            <!-- Contacts List -->
                            <div class="space-y-2 mt-2">
                                ${contactsHTML}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function highlightText(text, searchVal) {
            if (!searchVal || !text) return text || '';
            const regex = new RegExp(`(${searchVal.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark class="highlight">$1</mark>');
        }

        function openLocationModal(editId = null) {
            document.getElementById('locationForm').reset();
            document.getElementById('contactRowsContainer').innerHTML = '';

            if (editId) {
                const target = (window.locations || []).find(l => l.id === editId);
                if (target) {
                    document.getElementById('modalTitle').querySelector('span').textContent = '編輯地點資料';
                    document.getElementById('formLocationId').value = target.id;
                    document.getElementById('formName').value = target.name || '';
                    document.getElementById('formCategory').value = target.category || '';
                    document.getElementById('formAddress').value = target.address || '';
                    
                    (target.contacts || []).forEach(c => addContactRow(c.name, c.phone, c.role));
                }
            } else {
                document.getElementById('modalTitle').querySelector('span').textContent = '新增地點資料';
                document.getElementById('formLocationId').value = '';
                addContactRow();
            }

            document.getElementById('locationModal').classList.remove('hidden');
        }

        function closeLocationModal() {
            document.getElementById('locationModal').classList.add('hidden');
        }

        function addContactRow(name = '', phone = '', role = '') {
            const container = document.getElementById('contactRowsContainer');
            const rowId = 'cr_' + Date.now() + Math.random().toString(36).substr(2, 4);
            
            const div = document.createElement('div');
            div.id = rowId;
            div.className = 'grid grid-cols-12 gap-1.5 items-center bg-slate-950 p-2 rounded-xl border border-slate-800';
            div.innerHTML = `
                <div class="col-span-4">
                    <input type="text" placeholder="姓名" value="${name}" class="contact-name w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 focus:outline-none">
                </div>
                <div class="col-span-5">
                    <input type="tel" placeholder="電話" value="${phone}" class="contact-phone w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 font-mono focus:outline-none">
                </div>
                <div class="col-span-2">
                    <input type="text" placeholder="身份" value="${role}" class="contact-role w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 focus:outline-none">
                </div>
                <div class="col-span-1 text-center">
                    <button type="button" onclick="removeContactRow('${rowId}')" class="text-slate-500 active:text-rose-400 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        function removeContactRow(rowId) {
            const container = document.getElementById('contactRowsContainer');
            if (container.children.length > 1) {
                document.getElementById(rowId)?.remove();
            }
        }

        function editLocation(id) {
            openLocationModal(id);
        }

        async function saveLocation(e) {
            e.preventDefault();
            const id = document.getElementById('formLocationId').value || ('loc_' + Date.now());
            const name = document.getElementById('formName').value.trim();
            const category = document.getElementById('formCategory').value.trim();
            const address = document.getElementById('formAddress').value.trim();

            const rows = document.querySelectorAll('#contactRowsContainer > div');
            const contacts = [];

            rows.forEach(r => {
                const cName = r.querySelector('.contact-name').value.trim();
                const cPhone = r.querySelector('.contact-phone').value.trim();
                const cRole = r.querySelector('.contact-role').value.trim();
                if (cName || cPhone) {
                    contacts.push({ name: cName, phone: cPhone, role: cRole });
                }
            });

            if (contacts.length === 0) {
                showToast('請至少填寫一位聯絡人的姓名或電話！', 'error');
                return;
            }

            const locationObj = { id, name, category, address, contacts };

            try {
                // Supabase upsert (有 id 就更新，冇就新增)
                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .upsert([locationObj]);

                if (error) throw error;

                await loadLocations();
                showToast('資料已成功儲存至 Supabase 雲端資料庫！');
                closeLocationModal();
            } catch (err) {
                console.error(err);
                showToast('儲存至 Supabase 失敗', 'error');
            }
        }

        function promptDelete(id) {
            const target = (window.locations || []).find(l => l.id === id);
            if (!target) return;

            window.pendingDeleteId = id;
            document.getElementById('deleteTargetName').textContent = target.name;
            document.getElementById('deleteConfirmCheck').checked = false;
            
            toggleDeleteButton();
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function toggleDeleteButton() {
            const isChecked = document.getElementById('deleteConfirmCheck').checked;
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = !isChecked;
            if (isChecked) {
                btn.className = 'px-4 py-2 bg-rose-600 active:bg-rose-500 text-white text-xs font-semibold rounded-xl shadow-md transition cursor-pointer';
            } else {
                btn.className = 'px-4 py-2 bg-rose-600/40 text-slate-400 text-xs font-semibold rounded-xl transition cursor-not-allowed';
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            window.pendingDeleteId = null;
        }

        async function executeDelete() {
            if (!window.pendingDeleteId) return;

            try {
                // Supabase delete
                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .delete()
                    .eq('id', window.pendingDeleteId);

                if (error) throw error;

                await loadLocations();
                showToast('地點資料已順利自 Supabase 刪除');
                closeDeleteModal();
            } catch (err) {
                console.error(err);
                showToast('刪除失敗，請重試', 'error');
            }
        }

        function exportToPDF() {
            const pdfArea = document.getElementById('pdfPrintArea');
            pdfArea.innerHTML = `
                <div style="font-family: Arial, sans-serif; padding: 15px;">
                    <div style="text-align: center; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 8px;">
                        <h1 style="font-size: 18px; font-weight: bold; margin: 0;">緊急聯絡人資料總表 (24lkfstn)</h1>
                        <p style="font-size: 10px; color: #666; margin-top: 4px;">匯出時間：${new Date().toLocaleString('zh-HK')}</p>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                        <thead>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: left;">建築物 / 地點</th>
                                <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: left;">真實地址</th>
                                <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: left;">分類</th>
                                <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: left;">緊急聯絡人與電話</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(window.locations || []).map(loc => `
                                <tr>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; font-weight: bold;">${loc.name}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px;">${loc.address || '-'}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px;">${loc.category || '-'}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px;">
                                        ${(loc.contacts || []).map(c => `${c.name} : ${c.phone}`).join('<br>')}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            pdfArea.classList.remove('hidden');

            const opt = {
                margin:       8,
                filename:     `24lkfstn_緊急聯絡人資料庫_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(pdfArea).save().then(() => {
                pdfArea.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
